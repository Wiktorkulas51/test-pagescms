locale: 'pl'

backend:
  name: decap-server
  branch: master

local_backend: true

media_folder: public/media
public_folder: /media

collections:
  - name: offers
    label: Oferty
    folder: src/content/offers
    create: true
    extension: json
    slug: '{{slug}}'
    fields:
      - { name: slug, label: Identyfikator, widget: string }
      - { name: title, label: Tytuł oferty, widget: string }
      - { name: bankName, label: Nazwa banku, widget: string }
      - { name: bonusAmount, label: Kwota bonusu, widget: string }
      - { name: interestRate, label: Oprocentowanie, widget: string }
      - { name: isAccountFree, label: Konto darmowe?, widget: boolean }
      - { name: isCardFree, label: Karta darmowa?, widget: boolean }
      - { name: description, label: Opis, widget: text }
      - { name: affiliateLink, label: Link afiliacyjny, widget: string }
      - { name: category, label: Kategoria, widget: select, options: ['personal', 'business', 'loan'] }

  - name: pages
    label: Strony
    folder: src/content/pages
    create: true
    extension: json
    slug: '{{slug}}'
    fields:
      - { name: slug, label: Identyfikator, widget: string }
      - { name: title, label: Tytuł strony, widget: string }
      - { name: heroSubtitle, label: Podtytuł hero, widget: string, required: false }
      - { name: body, label: Treść, widget: markdown }
      - { name: price, label: Cena, widget: number, required: false }
      - { name: availableFrom, label: Data, widget: date, required: false }
      - label: SEO Meta
        name: meta
        widget: object
        required: false
        fields:
          - { name: metaTitle, label: Tytuł SEO, widget: string }
          - { name: metaDescription, label: Opis SEO, widget: text }
